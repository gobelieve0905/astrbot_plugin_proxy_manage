<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>代理管理中心</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./health.css">
</head>
<body>
  <aside>
    <div class="brand"><b>代理中心</b><small>CLASH VERGE · 0.2.8</small></div>
    <nav>
      <button data-tab="overview">概览</button>
      <button data-tab="subscriptions">订阅管理</button>
      <button data-tab="nodes">代理节点</button>
      <button data-tab="groups">代理组</button>
      <button data-tab="routes">分流规则</button>
      <button data-tab="platforms">平台策略</button>
      <button data-tab="control">控制接口</button>
      <button data-tab="logs">连接日志</button>
    </nav>
    <button id="reload">刷新状态</button>
  </aside>
  <main>
    <header>
      <div><span id="crumb">概览</span><h1>代理中心</h1><p class="muted">订阅自动化、节点健康和平台分流管理。</p></div>
      <div class="actions"><button id="rollback">恢复上一版</button><button id="save" class="primary">预览并保存</button></div>
    </header>
    <div id="notice" hidden></div>
    <section id="content"></section>
  </main>
  <datalist id="sub-groups"><option>主力</option><option>备用</option><option>测试</option></datalist>
  <dialog id="diff"><h2>确认配置变更</h2><pre id="diff-text"></pre><div class="dialog-actions"><button id="cancel">取消</button><button id="confirm" class="primary">确认保存</button></div></dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
