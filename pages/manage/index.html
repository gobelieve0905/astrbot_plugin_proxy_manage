<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>代理管理中心 - AstrBot 出站流量控制</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./health.css">
  <link rel="stylesheet" href="./download.css">
</head>
<body>
  <aside class="sidebar" aria-label="主导航">
    <div class="sidebar-header">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          <path d="M2 12h20"/>
        </svg>
      </div>
      <div class="brand-text">
        <h2 class="brand-title">代理管理中心</h2>
        <span class="brand-version">v0.3.16</span>
      </div>
    </div>
    
    <nav class="nav-menu" role="navigation">
      <button class="nav-item" data-tab="overview" aria-label="概览">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span class="nav-label">概览</span>
      </button>
      <button class="nav-item" data-tab="subscriptions" aria-label="订阅管理">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        <span class="nav-label">订阅管理</span>
      </button>
      <button class="nav-item" data-tab="nodes" aria-label="代理节点">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/>
          <line x1="12" y1="2" x2="12" y2="9"/><line x1="12" y1="15" x2="12" y2="22"/>
          <line x1="4.93" y1="4.93" x2="9.17" y2="9.17"/>
        </svg>
        <span class="nav-label">代理节点</span>
      </button>
      <button class="nav-item" data-tab="groups" aria-label="代理组">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
        <span class="nav-label">代理组</span>
      </button>
      <button class="nav-item" data-tab="routes" aria-label="分流规则">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
        <span class="nav-label">分流规则</span>
      </button>
      <button class="nav-item" data-tab="platforms" aria-label="平台模板">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/>
        </svg>
        <span class="nav-label">平台模板</span>
      </button>
      <button class="nav-item" data-tab="control" aria-label="内核管理">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6M5.64 5.64l4.24 4.24m4.24 4.24l4.24 4.24M1 12h6m6 0h6M5.64 18.36l4.24-4.24m4.24-4.24l4.24-4.24"/>
        </svg>
        <span class="nav-label">内核管理</span>
      </button>
      <button class="nav-item" data-tab="logs" aria-label="连接日志">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
        </svg>
        <span class="nav-label">连接日志</span>
      </button>
    </nav>
    
    <div class="sidebar-footer">
      <button id="reload" class="sidebar-action" title="刷新运行状态">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        <span>刷新状态</span>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <header class="page-header">
      <div class="header-info">
        <nav class="breadcrumb" aria-label="面包屑">
          <span id="crumb">概览</span>
        </nav>
        <h1 class="page-title">代理管理中心</h1>
        <p class="page-description" id="page-subtitle">运行状态、节点健康和流量策略总览</p>
      </div>
      <div class="header-actions">
        <button id="rollback" class="btn btn-secondary" title="恢复上一版配置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
          </svg>
          <span>恢复上一版</span>
        </button>
        <button id="save" class="btn btn-primary" title="预览并保存配置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
          </svg>
          <span>预览并保存</span>
        </button>
      </div>
    </header>

    <div id="notice" class="notice" hidden></div>
    
    <section id="content" class="content-area"></section>
  </main>

  <datalist id="sub-groups">
    <option>主力</option>
    <option>备用</option>
    <option>测试</option>
  </datalist>

  <dialog id="diff" class="modal">
    <div class="modal-header">
      <div class="modal-title-group">
        <span class="modal-subtitle">配置事务</span>
        <h2 class="modal-title">确认配置变更</h2>
      </div>
      <button id="cancel" class="modal-close" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <pre id="diff-text" class="diff-content"></pre>
    </div>
    <div class="modal-footer">
      <button id="dialog-cancel-btn" class="btn btn-secondary">取消</button>
      <button id="confirm" class="btn btn-primary">确认保存</button>
    </div>
  </dialog>

  <script type="module" src="./app.js"></script>
</body>
</html>
