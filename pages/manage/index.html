<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>代理管理中心</title>
  <link rel="stylesheet" href="./health.css">
  <link rel="stylesheet" href="./download.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <a class="skip-link" href="#content">跳到主要内容</a>
  <aside aria-label="主导航">
    <div class="brand"><span class="brand-mark" aria-hidden="true">PM</span><span><b>代理管理中心</b><small>流量控制 · 0.3.19</small></span></div>
    <nav>
      <span class="nav-label">工作区</span>
      <button data-tab="overview">概览</button>
      <button data-tab="subscriptions">订阅管理</button>
      <button data-tab="nodes">代理节点</button>
      <button data-tab="groups">代理组</button>
      <button data-tab="routes">分流规则</button>
      <button data-tab="platforms">平台域名模板</button>
      <span class="nav-label">运行与审计</span>
      <button data-tab="control">内核管理</button>
      <button data-tab="logs">连接日志</button>
    </nav>
    <button id="reload" type="button" title="刷新页面状态" aria-label="刷新页面状态">刷新状态</button>
  </aside>
  <main id="main-content" tabindex="-1">
    <header>
      <div><span id="crumb">概览</span><h1>代理管理中心</h1><p class="muted" id="page-subtitle">运行状态、节点健康和流量策略总览</p></div>
      <div class="actions"><button id="rollback">恢复上一版</button><button id="save" class="primary">预览并保存</button></div>
    </header>
    <div id="notice" role="status" aria-live="polite" aria-atomic="true" hidden></div>
    <div id="task-banner" role="status" aria-live="polite" aria-atomic="true" hidden></div>
    <section id="content"></section>
  </main>
  <dialog id="diff" aria-labelledby="diff-title"><div class="dialog-head"><div><small>配置事务</small><h2 id="diff-title">确认配置变更</h2></div><button id="cancel" type="button" class="quiet" aria-label="取消配置变更">取消</button></div><div id="diff-content" class="change-preview" aria-live="polite"></div><div class="dialog-actions"><button id="confirm" type="button" class="primary">确认保存</button></div></dialog>
  <dialog id="subscription-import-dialog" class="import-dialog" aria-labelledby="subscription-import-title">
    <div class="dialog-head"><div><small id="subscription-import-kicker">订阅来源</small><h2 id="subscription-import-title">导入订阅</h2></div><button id="subscription-import-close" type="button" class="quiet" aria-label="关闭订阅导入弹窗">关闭</button></div>
    <div id="subscription-import-body" class="import-dialog-body"></div>
    <div id="subscription-import-actions" class="dialog-actions"></div>
  </dialog>
  <dialog id="proxy-group-dialog" class="group-dialog" aria-labelledby="proxy-group-title">
    <div class="dialog-head"><div><small>代理组配置</small><h2 id="proxy-group-title">新增代理组</h2></div><button id="proxy-group-close" type="button" class="quiet" aria-label="关闭代理组配置弹窗">关闭</button></div>
    <div id="proxy-group-body" class="group-dialog-body"></div>
    <div id="proxy-group-actions" class="dialog-actions"></div>
  </dialog>
  <dialog id="proxy-node-dialog" class="node-dialog" aria-labelledby="proxy-node-title">
    <div class="dialog-head"><div><small>代理节点详情</small><h2 id="proxy-node-title">节点详情</h2></div><button id="proxy-node-close" type="button" class="quiet" aria-label="关闭节点详情弹窗">关闭</button></div>
    <div id="proxy-node-body" class="node-dialog-body"></div>
    <div id="proxy-node-actions" class="dialog-actions"></div>
  </dialog>
  <script src="./app.js"></script>
</body>
</html>
