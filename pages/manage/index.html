<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>代理管理中心</title><link rel="stylesheet" href="./style.css"></head><body><main>
<header><div><p class="eyebrow">EGRESS CONTROL · 0.1.2</p><h1>代理管理中心</h1><p class="muted">管理平台出口、域名分流和节点诊断。</p></div><div class="actions"><button id="reload">刷新</button><button id="save" class="primary">预览并保存</button></div></header><div id="notice" class="notice" hidden></div>
<section class="grid"><article><span class="label">代理策略</span><strong id="profile-count">-</strong></article><article><span class="label">分流规则</span><strong id="route-count">-</strong></article><article><span class="label">节点目录</span><strong id="node-count">-</strong></article><article><span class="label">事件记录</span><strong id="event-count">-</strong></article></section>
<section class="panel"><div class="panel-head"><div><h2>代理策略</h2><p class="muted">Telegram、Meta、GitHub 可绑定不同出口；未配置平台默认直连。</p></div><button id="add-profile">新增策略</button></div><div id="profiles" class="rows"></div></section>
<section class="panel"><div class="panel-head"><div><h2>分流规则</h2><p class="muted">精确匹配只匹配一个域名，后缀匹配覆盖该域名及其子域名。</p></div><button id="add-route">新增规则</button></div><div id="routes" class="rows"></div></section>
<section class="panel"><h2>平台模板</h2><div id="templates" class="template-grid"></div></section>
<section class="panel"><h2>分流预览</h2><div class="inline"><input id="host" placeholder="例如 api.telegram.org"><button id="preview">查询策略</button></div><pre id="preview-result" class="result">输入域名后查看命中的出口策略。</pre></section>
<section class="panel"><div class="panel-head"><div><h2>连通性诊断</h2><p class="muted">不携带业务 Token，不读取响应正文。</p></div><button id="probe">开始检测</button></div><div class="inline"><select id="probe-profile"></select><input id="probe-url" value="https://www.gstatic.com/generate_204"></div><div id="probe-result" class="result">尚未检测。</div></section>
<section class="panel"><h2>最近事件</h2><div id="events" class="events"></div></section><footer>保存前会校验策略和规则冲突；保存失败时保留上一版配置。</footer></main><dialog id="diff"><h2>确认配置变更</h2><pre id="diff-text" class="result"></pre><div class="dialog-actions"><button id="diff-cancel">取消</button><button id="diff-confirm" class="primary">确认保存</button></div></dialog><script type="module" src="./app.js"></script></body></html>
